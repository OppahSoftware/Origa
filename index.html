<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Origa - Em Breve</title>
    
    <!-- Importação da Fonte Oficial Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Utilização do Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        origa: {
                            cyan: '#224949',   /* Ciano Escuro Oficial */
                            yellow: '#e2b320', /* Amarelo Oficial */
                            gray: '#989898',   /* Cinza Oficial */
                            light: '#f9fafa'   /* Fundo Claro */
                        }
                    },
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-origa-light text-gray-800 font-sans antialiased min-h-screen flex flex-col items-center justify-center relative overflow-hidden">

    <!-- Elementos visuais de fundo para não deixar a tela "vazia" -->
    <div class="absolute inset-0 overflow-hidden opacity-5 pointer-events-none">
        <svg class="absolute h-full w-full" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
            <defs>
                <pattern id="grid-pattern" width="60" height="60" patternUnits="userSpaceOnUse">
                    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#224949" stroke-width="2"/>
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#grid-pattern)"/>
        </svg>
    </div>

    <!-- Card Central -->
    <main class="relative z-10 max-w-2xl w-full mx-auto px-6 text-center">
        
        <!-- Logotipo Origa -->
        <div class="flex justify-center items-center gap-4 mb-8">
            <img src="3_2.png" alt="Símbolo Origa" class="h-20 w-auto object-contain" onerror="this.src='https://placehold.co/100x100/224949/e2b320?text=OR'">
            <span class="font-extrabold text-5xl tracking-widest text-origa-cyan uppercase mt-2">Origa</span>
        </div>

        <!-- Mensagem de Manutenção -->
        <h1 class="text-3xl md:text-4xl font-extrabold text-origa-cyan mb-4">
            Estamos preparando novidades!
        </h1>
        <p class="text-lg text-gray-600 mb-10 max-w-lg mx-auto">
            O nosso novo site oficial está em desenvolvimento para lhe oferecer a melhor experiência em ferragens, componentes e escovas de vedação.
        </p>

        <!-- Botão Mercado Livre -->
        <a href=https://lista.mercadolivre.com.br/_CustId_3631128401 target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center bg-origa-yellow text-origa-cyan hover:bg-yellow-400 font-bold text-lg px-8 py-4 rounded-md shadow-lg transform transition-all duration-300 hover:-translate-y-1 w-full sm:w-auto gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 256 256">
                <path d="M216,40H40A16,16,0,0,0,24,56V200a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40Zm0,160H40V56H216V200ZM176,88a48,48,0,0,1-96,0,8,8,0,0,1,16,0,32,32,0,0,0,64,0,8,8,0,0,1,16,0Z"></path>
            </svg>
            Comprar no Mercado Livre
        </a>

        <!-- Rodapé Minimalista -->
        <div class="mt-16 text-sm text-gray-400 font-semibold">
            <p>Precisão em cada encaixe.</p>
            <p class="mt-1">&copy; 2026 Origa. Botucatu, SP - Brasil</p>
        </div>

    </main>
</body>
</html>
